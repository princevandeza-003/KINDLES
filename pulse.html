<style>

.chart{width:100%;height:auto}.chart text{fill:var(--mute);font-size:10px}

.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.big{font:800 96px/1 "Barlow Condensed",sans-serif;color:var(--acc)}.big small{font-size:28px;color:var(--mute)}
.xl{font-size:42px;line-height:1.05}

button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.ov.on{display:flex}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}.err{color:var(--acc);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="ov" id="auth"><div class="box"><div class="brand" style="font-size:38px">PULSE<span>FIT</span></div><p class="mute">Log in to save your plans and progress to your account and use them on any device.</p><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="btn" id="lin" style="margin:0">Log in</button><button class="btn ghost" id="sup" style="margin:0">Create account</button><button class="chip" id="skip">Continue without an account</button><p class="err" id="aerr"></p></div></div>
<div id="app">
<header><div class="brand">PULSE<span>FIT</span></div><div class="row"><span id="sync" class="mute"></span><button class="ib" id="acct" aria-label="Account">👤</button><button class="ib" id="th" aria-label="Switch theme">◐</button></div></header>

</div>

<script>

/* ---- workout player ---- */
function secs(r){return /s$/.test(r)?parseInt(r):0}
function cur(){return WK[W.id][2][W.i]}
function tot(){return WK[W.id][2].reduce(function(a,x){return a+x[1]},0)}
function openW(id){W={id:id,i:0,s:1,ph:"work",t:secs(WK[id][2][0][2]),run:false,dn:0};clearInterval(iv);iv=setInterval(tick,1000);ow()}
function ow(){var o=$("ov");o.hidden=false;var w=WK[W.id],e=cur(),h='<div class="ph"><b class="disp" style="font-size:20px">'+esc(w[0])+'</b><button class="ib" data-a="p_end" aria-label="Close">✕</button></div><div class="prog"><i style="width:'+Math.round(W.dn/tot()*100)+'%"></i></div><div class="stage">';
 if(W.ph==="done"){var k=Math.round(w[1]*6.5*(((D.p&&D.p.w)||70)/70));h+='<div style="font-size:72px">🎉</div><h1>Workout complete</h1><p class="mute">'+w[1]+' min · about '+k+' kcal</p><button class="btn" data-a="p_end">Finish</button>'}
 else if(W.ph==="rest")h+='<div class="mute">REST</div><div class="big" id="tm">'+W.t+'</div><p class="mute">Next: <b>'+esc(e[0])+'</b> · set '+W.s+' of '+e[1]+'</p><div class="row" style="justify-content:center"><button class="btn ghost" data-a="p_add">+15s</button><button class="btn" data-a="p_skip">Skip rest</button></div>';
 else{var ts=secs(e[2]);h+='<div class="mute">Set '+W.s+' of '+e[1]+'</div><h2 class="xl">'+esc(e[0])+'</h2>'+(ts?'<div class="big" id="tm">'+W.t+'</div><div class="row" style="justify-content:center"><button class="btn" data-a="p_go">'+(W.run?"Pause":"Start")+'</button><button class="btn ghost" data-a="p_done">Done</button></div>':'<div class="big">'+e[2]+' <small>reps</small></div><button class="btn" data-a="p_done">Done set ✓</button>')}
 o.innerHTML=h+'</div>'}
function tick(){if(!W||!W.run)return;W.t--;var el=$("tm");if(el)el.textContent=W.t;if(W.t<=0){beep();W.run=false;if(W.ph==="rest"){W.ph="work";W.t=secs(cur()[2]);ow()}else pdone()}}
function pdone(){var e=cur();W.dn++;if(W.dn>=tot()){clearInterval(iv);var w=WK[W.id];D.log.push({d:tod(),n:w[0],min:w[1],kcal:Math.round(w[1]*6.5*(((D.p&&D.p.w)||70)/70))});sv();W.ph="done";ow();return}
 if(W.s<e[1])W.s++;else{W.i++;W.s=1}W.ph="rest";W.t=secs(e[2])?30:45;W.run=true;ow()}
function pact(a){if(a==="p_done")pdone();else if(a==="p_go"){W.run=!W.run;ow()}else if(a==="p_add"){W.t+=15;$("tm").textContent=W.t}
 else if(a==="p_skip"){W.ph="work";W.t=secs(cur()[2]);W.run=false;ow()}
 else if(a==="p_end"){clearInterval(iv);W=null;$("ov").hidden=true;render()}}
/* ---- actions ---- */
document.addEventListener("click",function(e){var el=e.target.closest("[data-a],[data-t]");if(!el)return;
 if(el.dataset.t){tab=el.dataset.t;open=null;render();return}
 var a=el.dataset.a,id=el.dataset.id,t=tod();
 if(a.indexOf("p_")===0){pact(a);return}
 if(a==="goal"){D.p=D.p||{};D.p.goal=el.dataset.g;D.plan={lose:"fat",keep:"start",gain:"muscle"}[el.dataset.g];D.planStart=t}
 else if(a==="plan")open=id;else if(a==="plans")open=null;
 else if(a==="setplan"){D.plan=id;D.planStart=t;toast("Plan started")}
 else if(a==="start"){openW(id);return}
 else if(a==="wp")D.water[t]=(D.water[t]||0)+1;else if(a==="wm")D.water[t]=Math.max(0,(D.water[t]||0)-1);
 else if(a==="meal"){var n=$("mn").value.trim(),k=+$("mk").value;if(!n||!(k>0))return toast("Add a meal and its calories");(D.meals[t]=D.meals[t]||[]).push({n:n.slice(0,40),k:Math.round(k)})}
 else if(a==="mdel")D.meals[t].splice(+id,1);
 else if(a==="wt"){var v=parseFloat($("wv").value);if(!(v>20&&v<400))return toast("Enter your weight in kg");D.wt=D.wt.filter(function(x){return x.d!==t});D.wt.push({d:t,v:v});D.wt.sort(function(x,y){return x.d<y.d?-1:1});if(D.p)D.p.w=v}
 else if(a==="prof"){D.name=$("pn").value.trim().slice(0,20);D.p=D.p||{};D.p.a=+$("pa").value||0;D.p.sex=$("ps").value;D.p.h=+$("ph").value||0;D.p.w=+$("pw").value||0;D.p.act=+$("pc").value;D.p.goal=$("pg").value;toast("Profile saved")}
 else if(a==="rm"){var w=+$("rw").value,r=+$("rr").value;$("rmo").textContent=w>0&&r>0?"Estimated 1RM: "+Math.round(r===1?w:w*(1+r/30))+" kg":"Enter the weight and reps.";return}
 sv();render()});
$("th").onclick=function(){var d=document.documentElement,dk=matchMedia("(prefers-color-scheme:dark)").matches,n=d.dataset.theme||(dk?"dark":"light");d.dataset.theme=n==="dark"?"light":"dark"};
async function push(){var u=await sb.auth.getUser();if(!u.data.user)return;var r=await sb.from("pf_data").upsert({user_id:u.data.user.id,data:D,updated_at:new Date().toISOString()});setSync(r.error?"⚠️ Not synced":"☁️ Synced")}
async function pull(){var r=await sb.from("pf_data").select("data").maybeSingle(),c=r.data&&r.data.data;
 if(r.error){setSync("⚠️ Offline");return}
 if(c&&Object.keys(c).length&&(c.u||0)>=(D.u||0)){D=c;D.log=D.log||[];D.water=D.water||{};D.meals=D.meals||{};D.wt=D.wt||[];try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
 else await push();
 setSync("☁️ Synced");render()}
function say(t){$("aerr").textContent=t}
async function afterLogin(){$("auth").classList.remove("on");cloud=true;await pull()}
async function initAuth(){
 if(typeof sb==="undefined"||SUPABASE_URL.indexOf("YOUR-PROJECT")>-1){$("acct").hidden=true;return}
 var r=await sb.auth.getSession();
 if(r.data.session){await afterLogin();return}
 var skipped=false;try{skipped=localStorage.getItem("pf:skip")==="1"}catch(e){}
 if(!skipped)$("auth").classList.add("on")}
$("lin").onclick=async function(){var r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});if(r.error)return say(r.error.message);afterLogin()};
$("sup").onclick=async function(){if($("pw").value.length<8)return say("Use a password with 8+ characters.");var r=await sb.auth.signUp({email:$("em").value,password:$("pw").value});if(r.error)return say(r.error.message);if(!r.data.session)return say("Check your email to confirm your account, then log in.");afterLogin()};
$("skip").onclick=function(){try{localStorage.setItem("pf:skip","1")}catch(e){}$("auth").classList.remove("on")};
$("acct").onclick=async function(){var r=await sb.auth.getSession();if(!r.data.session){$("auth").classList.add("on");return}
 var c=prompt("Type LOGOUT to log out, or DELETE to erase your cloud data and log out.");if(!c)return;c=c.trim().toUpperCase();
 if(c==="DELETE"){await sb.from("pf_data").delete().eq("user_id",r.data.session.user.id)}
 if(c==="LOGOUT"||c==="DELETE"){await sb.auth.signOut();location.reload()}};
render();initAuth();
</script>
</body>
</html>
