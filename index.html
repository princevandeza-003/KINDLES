<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e1e21">
<title>Kindle – dating with intent</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe9;--surf:#fff;--ink:#1d2326;--mute:#6b777b;--line:#ded8cf;--acc:#e8466b;--acc2:#1f7a6d;--gold:#e5a823;--shadow:0 12px 30px rgba(20,40,40,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1e21;--surf:#173136;--ink:#f1ede6;--mute:#97aaae;--line:#2a4a50;--acc:#ff7a98;--acc2:#52c7b4;--gold:#f2c14e;--shadow:0 12px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1e21;--surf:#173136;--ink:#f1ede6;--mute:#97aaae;--line:#2a4a50;--acc:#ff7a98;--acc2:#52c7b4;--gold:#f2c14e;--shadow:0 12px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 "DM Sans",system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:none;height:100%;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px}
header h1{font-size:24px;font-weight:800;color:var(--acc)}
.modes{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:3px}
.modes button{border:0;background:none;color:var(--mute);font:500 13px "DM Sans",sans-serif;padding:6px 11px;border-radius:99px;cursor:pointer}
.modes button.on{background:var(--acc2);color:#fff}
main{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
#deck{flex:1;position:relative;margin:8px 16px 0;min-height:0}
.card{position:absolute;inset:0;border-radius:22px;background:var(--surf);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;will-change:transform}
.card.back{transform:scale(.95) translateY(14px);opacity:.7;pointer-events:none}
.photo{flex:0 0 46%;position:relative;display:flex;align-items:center;justify-content:center;font-size:84px}
.photo .intent{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.photo .score{position:absolute;top:12px;right:12px;background:var(--gold);color:#201800;font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px}
.info{padding:14px 16px;overflow:auto;flex:1}
.info h2{font-size:26px;font-weight:800}
.info h2 span{font-weight:500;color:var(--mute)}
.meta{color:var(--mute);font-size:13px;margin-bottom:10px}
.prompt{border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0 12px}
.prompt small{color:var(--mute);display:block;font-size:12px}
.prompt p{font:700 16px "Bricolage Grotesque",sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;background:none;color:var(--ink);font-family:inherit}
.chip.shared{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:500}
.stamp{position:absolute;top:70px;font:800 30px "Bricolage Grotesque",sans-serif;border:4px solid;border-radius:10px;padding:2px 12px;opacity:0;transform:rotate(-12deg);pointer-events:none}
.stamp.l{left:18px;color:#38c27a}.stamp.n{right:18px;color:#ff5a5a;transform:rotate(12deg)}
.actions{display:flex;justify-content:center;gap:14px;padding:14px 0 10px}
.actions button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:24px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.actions button:active{transform:scale(.9)}
.actions .sm{width:46px;height:46px;font-size:18px;align-self:center}
.empty{margin:auto;text-align:center;padding:30px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:10px 18px;font:700 14px "DM Sans",sans-serif;cursor:pointer;margin-top:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;color:var(--mute);font:500 12px "DM Sans",sans-serif;cursor:pointer;position:relative}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--acc);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.list{overflow:auto;padding:8px 16px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surf);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font-family:inherit}
.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.row small{color:var(--mute);display:block}
.chat{display:none;position:absolute;inset:0;background:var(--bg);flex-direction:column;z-index:5}
.chat.on{display:flex}
.chat header{border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--acc);border-color:var(--acc);color:#fff}
.ice{display:flex;gap:6px;overflow-x:auto;padding:4px 16px}
.ice button{flex:none;border:1px dashed var(--acc2);color:var(--acc2);background:none;border-radius:99px;padding:6px 12px;font:500 13px "DM Sans",sans-serif;cursor:pointer}
.send{display:flex;gap:8px;padding:8px 16px 12px}
.send input{flex:1;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:10px 14px;font:inherit}
.me-sec{padding:6px 16px 16px;overflow:auto}
.me-sec h3{margin:14px 0 8px}
.chip.pick{cursor:pointer}.chip.pick.on{background:var(--acc);border-color:var(--acc);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.modal.on{display:flex}
.modal div{background:var(--surf);border-radius:22px;padding:26px;text-align:center;max-width:320px}
.modal h2{font-size:30px;color:var(--acc);margin-bottom:6px}
.pair{font-size:44px;margin:8px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:30;overflow:auto;padding:20px}.ov.on{display:flex}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;margin:auto}.box h1{font-size:34px;font-weight:800;color:var(--acc)}
.box input,.box select,.box textarea{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit}
.box label{font-size:13px;color:var(--mute)}.btn.alt{background:none;color:var(--acc2);border:1px solid var(--acc2)}.err{color:var(--acc);font-size:13px;min-height:18px}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#app{position:relative;z-index:1}
body{--b1:#ff9a8b;--b2:#ffd36e;--b3:#e8466b}
body[data-scene="matches"]{--b1:#52c7b4;--b2:#ff9ab0;--b3:#ffd36e}
body[data-scene="me"]{--b1:#a58bff;--b2:#52c7b4;--b3:#ff9ab0}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.45;transition:background-color 1.4s;animation:drift 22s ease-in-out infinite alternate}
.blob:nth-child(1){left:-15vmax;top:-10vmax;background-color:var(--b1)}
.blob:nth-child(2){right:-20vmax;top:25%;background-color:var(--b2);animation-duration:28s;animation-delay:-8s}
.blob:nth-child(3){left:10%;bottom:-25vmax;background-color:var(--b3);animation-duration:34s;animation-delay:-15s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blob{opacity:.28}}
:root[data-theme="dark"] .blob{opacity:.28}
.heart{position:absolute;bottom:-40px;color:var(--acc);opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.35}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.ov{background:var(--bg);background:color-mix(in srgb,var(--bg) 40%,transparent)}
.chat{background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent)}
@media (prefers-reduced-motion:reduce){.blob,.heart{animation:none}.heart{display:none}}
#deck{margin:8px auto 0;width:calc(100% - 32px);max-width:560px}
.list,.me-sec{width:100%;max-width:720px;align-self:center}
.msgs,.ice,.send{width:100%;max-width:720px;align-self:center}
.mepic{width:140px;height:140px;border-radius:50%;margin:8px auto 4px;display:flex;align-items:center;justify-content:center;font:800 56px "Bricolage Grotesque",sans-serif;color:#fff;box-shadow:var(--shadow)}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:4px;justify-content:center}.dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.45)}.dots i.on{background:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.gi{aspect-ratio:3/4;border-radius:12px;position:relative}
.gi button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.m audio{max-width:100%;height:36px}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="ov" id="auth"><div class="box"><h1>Kindle</h1><p class="meta">Dating with intent. For people 18 and over.</p>
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<button class="btn" id="lin">Log in</button><button class="btn alt" id="sup">Create account</button><p class="err" id="aerr"></p></div></div>
<div class="ov" id="setup"><div class="box"><h2 class="disp">Set up your profile</h2>
<label>First name</label><input id="sn" maxlength="40"><label>Birthdate (you must be 18+)</label><input id="sb" type="date"><label>I am</label><select id="sg"><option value="">Select…</option><option value="woman">Woman</option><option value="man">Man</option><option value="nonbinary">Non-binary</option></select><label>Interested in (pick all that apply)</label><div class="chips" id="sgi"></div>
<label>I’m looking for</label><select id="si"><option>Serious</option><option selected>Casual</option><option>Friends</option></select>
<label>Prompt</label><select id="sq"><option>Ask me about</option><option>Best first date</option><option>Typical Sunday</option></select><textarea id="sa" rows="3" maxlength="300" placeholder="Your answer"></textarea>
<label>Interests</label><div class="chips" id="sch"></div><label>Photo</label><input id="sp" type="file" accept="image/*" multiple>
<button class="btn" id="sgo">Start swiping</button><p class="err" id="serr"></p></div></div>
<div id="app">
  <header><h1>Kindle</h1>
    <div style="display:flex;gap:8px;align-items:center"><div class="modes" id="modes" role="group" aria-label="What are you looking for"></div><button class="chip" id="fs" type="button" title="Full screen" aria-label="Full screen" style="font-size:18px;cursor:pointer;background:var(--surf)">⛶</button></div>
  </header>
  <main>
    <section class="view on" id="v-discover">
      <div id="deck"></div>
      <div class="actions">
        <button class="sm" id="b-undo" title="Rewind" aria-label="Rewind">↩</button>
        <button id="b-nope" title="Pass" aria-label="Pass">✕</button>
        <button id="b-super" title="Super like" aria-label="Super like">★</button>
        <button id="b-like" title="Like" aria-label="Like">♥</button>
        <button class="sm" id="b-flag" title="Report or block" aria-label="Report or block">⚑</button>
      </div>
    </section>
    <section class="view" id="v-matches"><div class="list" id="mlist"></div></section>
    <section class="view" id="v-me"><div class="me-sec" id="me"></div></section>
    <div class="chat" id="chat">
      <header><button class="btn" style="margin:0;padding:6px 12px" id="back">Back</button><h3 id="cname"></h3><button class="btn" style="margin:0;padding:6px 12px;background:none;color:var(--mute)" id="flag">Report</button></header>
      <div class="msgs" id="msgs"></div>
      <div class="ice" id="ice"></div>
      <form class="send" id="sendf"><button type="button" class="btn alt" id="mic" style="margin:0" aria-label="Record voice message">🎤</button><input id="inp" placeholder="Say something kind…" autocomplete="off"><button class="btn" style="margin:0">Send</button></form>
    </div>
  </main>
  <nav>
    <button class="on" data-v="discover"><b>🔥</b>Discover</button>
    <button data-v="matches"><b>💬</b>Matches<span class="dot" id="dot" hidden></span></button>
    <button data-v="me"><b>🙂</b>My profile</button>
  </nav>
</div>
<div class="modal" id="modal"><div>
  <h2>It’s a match!</h2><div class="pair" id="pair"></div>
  <p id="mtxt"></p>
  <button class="btn" id="mchat">Start chatting</button>
  <button class="btn" style="background:none;color:var(--mute)" id="mkeep">Keep swiping</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="api.js"></script>
<script>
window.onerror=function(m,u,l){var e=document.createElement("div");e.style.cssText="position:fixed;left:0;right:0;bottom:0;background:#b00020;color:#fff;padding:12px;z-index:99;font:13px/1.4 sans-serif";e.textContent="Error: "+m+(l?" (line "+l+")":"");document.body.appendChild(e)};
window.addEventListener("unhandledrejection",function(e){window.onerror(e.reason&&e.reason.message||"request failed")});
if(typeof API==="undefined"||typeof sb==="undefined"){document.body.innerHTML='<div style="padding:24px;font:16px/1.5 sans-serif"><h2>Kindle can’t start</h2><p>api.js or the Supabase library didn’t load. Open <b>api.js</b> on GitHub and check the first two lines (URL and key inside quotation marks, each line ending with a semicolon), then check your internet connection and reload.</p></div>';throw new Error("api.js not loaded")}
var INTERESTS=["Hiking","Coffee","Live music","Cooking","Board games","Film","Climbing","Travel","Books","Yoga","Photography","Dogs","Gaming","Art","Running","Vinyl"];
var S={mode:"All",mine:[],queue:[],hist:[],matches:[],cur:null,ch:null,me:null,into:[]};
var GEN=[["woman","Women"],["man","Men"],["nonbinary","Non-binary people"]],GL={woman:"Woman",man:"Man",nonbinary:"Non-binary"};
function gchips(el){el.innerHTML=GEN.map(function(g){return '<button type="button" class="chip pick'+(S.into.indexOf(g[0])>-1?" on":"")+'" data-g="'+g[0]+'">'+g[1]+'</button>'}).join("")}
S.maxKm=null;S.hasLoc=false;var AU={};
API.discover=function(intent){return sb.rpc("discover",{p_intent:intent&&intent!=="All"?intent:null,p_max_km:S.hasLoc&&S.maxKm?S.maxKm:null})};
API.sendVoice=async function(matchId,blob,ext){var u=await API.user();var path=matchId+"/"+Date.now()+"."+ext;var up=await sb.storage.from("voice").upload(path,blob,{contentType:blob.type});if(up.error)return up;return sb.from("messages").insert({match_id:matchId,sender:u.id,body:"🎤 Voice message",audio_path:path})};
API.addPhotos=async function(files){var u=await API.user();var r=await API.myProfile();var list=(r.data&&r.data.photos||[]).slice();for(var i=0;i<files.length&&list.length<6;i++){var b=await shrink(files[i]);var path=u.id+"/g-"+Date.now()+"-"+i+".jpg";var up=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});if(up.error)return up;list.push(path)}return sb.from("profiles").update({photos:list,photo_path:list[0]||null}).eq("id",u.id)};
API.removePhoto=async function(path){var u=await API.user();var r=await API.myProfile();var list=(r.data.photos||[]).filter(function(x){return x!==path});await sb.storage.from("photos").remove([path]);return sb.from("profiles").update({photos:list,photo_path:list[0]||null}).eq("id",u.id)};
API.setLocation=async function(lat,lng){var u=await API.user();return sb.from("locations").upsert({user_id:u.id,lat:Math.round(lat*100)/100,lng:Math.round(lng*100)/100,updated_at:new Date().toISOString()})};
API.clearLocation=async function(){var u=await API.user();return sb.from("locations").delete().eq("user_id",u.id)};
API.hasLocation=async function(){var u=await API.user();var r=await sb.from("locations").select("user_id").eq("user_id",u.id).maybeSingle();return !!r.data};
API.saveProfile=async function(p){var u=await API.user();return sb.from("profiles").upsert({id:u.id,name:p.name,birthdate:p.birthdate,gender:p.gender,interested_in:p.interested_in,intent:p.intent,prompt_q:p.prompt_q,prompt_a:p.prompt_a,interests:p.interests})};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function age(b){var d=new Date(b),n=new Date(),a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))a--;return a}
function hue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}
function pl(p){return p.photos&&p.photos.length?p.photos:(p.photo_path?[p.photo_path]:[])}
function bg(p,i){var u=API.photoUrl(pl(p)[i||0]),h=hue(p.id);return u?"background:center/cover url('"+u+"')":"background:linear-gradient(145deg,hsl("+h+",70%,62%),hsl("+(h+50)+",65%,38%))"}
function score(p){var sh=(p.interests||[]).filter(function(x){return S.mine.indexOf(x)>-1}).length;return Math.min(98,52+sh*12+(S.mode===p.intent?8:0))}
function say(id,t){$(id).textContent=t}
function toast(t){var e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:40;font-weight:500";document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
async function shrink(f){var b=await createImageBitmap(f),k=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(function(r){c.toBlob(r,"image/jpeg",.85)})}
function chips(el){el.innerHTML=INTERESTS.map(function(x){return '<button type="button" class="chip pick'+(S.mine.indexOf(x)>-1?" on":"")+'" data-i="'+x+'">'+x+'</button>'}).join("")}
document.addEventListener("click",async function(e){var i=e.target.dataset&&e.target.dataset.i;if(!i||!e.target.classList.contains("pick"))return;var k=S.mine.indexOf(i);k>-1?S.mine.splice(k,1):S.mine.push(i);e.target.classList.toggle("on");if(S.me&&!$("setup").classList.contains("on")){await API.saveProfile(pobj());loadQueue()}});
document.addEventListener("click",async function(e){var g=e.target.dataset&&e.target.dataset.g;if(!g||!e.target.classList.contains("pick"))return;var k=S.into.indexOf(g);k>-1?S.into.splice(k,1):S.into.push(g);e.target.classList.toggle("on");if(S.me&&!$("setup").classList.contains("on")){if(!S.into.length){S.into.push(g);e.target.classList.add("on");return toast("Pick at least one.")}await API.saveProfile(pobj());loadQueue()}});
function pobj(){var p=S.me;return {name:p.name,birthdate:p.birthdate,gender:p.gender,interested_in:S.into,intent:p.intent,prompt_q:p.prompt_q,prompt_a:p.prompt_a,interests:S.mine}}
/* ---- start-up and login ---- */
async function init(){
 if(SUPABASE_URL.indexOf("YOUR-PROJECT")>-1){$("auth").classList.add("on");return say("aerr","Add your Supabase URL and anon key at the top of api.js first.")}
 var u=await API.user();if(!u){$("auth").classList.add("on");return}
 $("auth").classList.remove("on");var r=await API.myProfile();
 if(!r.data||!r.data.gender){var d=r.data||{};if(d.name)$("sn").value=d.name;if(d.birthdate)$("sb").value=d.birthdate;if(d.intent)$("si").value=d.intent;S.mine=d.interests||[];S.into=d.interested_in||[];chips($("sch"));gchips($("sgi"));$("setup").classList.add("on");return}
 S.me=r.data;S.mine=S.me.interests||[];S.into=S.me.interested_in||[];$("setup").classList.remove("on");start()}
$("lin").onclick=async function(){var r=await API.signIn($("em").value,$("pw").value);if(r.error)return say("aerr",r.error.message);init()};

function render(){var d=$("deck");d.innerHTML="";
 if(!S.queue.length){d.innerHTML='<div class="empty"><h3>You’re all caught up</h3><p>No new people in '+(S.mode==="All"?"your area":esc(S.mode))+' right now. Check back soon or try another mode.</p><button class="btn" id="again">Refresh</button></div>';$("again").onclick=loadQueue;return}

function drag(c){var x0=0,y0=0,dx=0,on=false;

 c.onpointermove=function(e){if(!on)return;dx=e.clientX-x0;var dy=e.clientY-y0;c.style.transform="translate("+dx+"px,"+dy*.3+"px) rotate("+dx/18+"deg)";c.querySelector(".l").style.opacity=Math.max(0,dx/90);c.querySelector(".n").style.opacity=Math.max(0,-dx/90)};

async function swipe(kind){var c=$("deck").querySelector(".card:not(.back)"),p=S.queue[0];if(!p||!c)return;
